name: Build iOS IPA

# 在 GitHub 的 macOS runner 上完成 NativeAOT 链接 + Xcode 打包，
# 产出未签名 IPA（用 Sideloadly / AltStore / TrollStore 侧载到 iPhone/iPad）。
#
# 仓库根目录需要包含：
#   sts2.csproj  sts2.sln  src/  addons/  RiderTestRunner/  libs/
#   tools/BfiPatch/  tools/patch_pbxproj.py  bfi_types.txt  nuget.config  nuget_local/
#   sts2.xcodeproj/  sts2/  PrivacyInfo.xcprivacy  sts2.pck
#
# sts2.pck 约 1.5 GB，请用 Git LFS 或 Release 资产挂载（见 README）。

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle Identifier'
        required: false
        default: 'com.placeholder.sts2'
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.placeholder.sts2' }}
      PCK_TAG: v0.107.1-ios
      PCK_ASSET: sts2.pck
      FW_ASSET: sts2-frameworks.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Show environment
        run: |
          xcodebuild -version
          dotnet --info
          sw_vers
          df -h /

      - name: Fetch sts2.pck from release
        run: |
          if [ -f sts2.pck ]; then
            echo "sts2.pck already in checkout (LFS), skipping download"
            ls -lh sts2.pck
            exit 0
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/${PCK_TAG}/${PCK_ASSET}"
          echo "downloading $URL"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
               -o sts2.pck "$URL"
          ls -lh sts2.pck

      - name: Fetch engine xcframeworks from release
        run: |
          if [ -d sts2.xcframework ] && [ -d MoltenVK.xcframework ]; then
            echo "xcframeworks already in checkout, skipping download"
            exit 0
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/${PCK_TAG}/${FW_ASSET}"
          echo "downloading $URL"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
               -o "$FW_ASSET" "$URL"
          ls -lh "$FW_ASSET"
          unzip -q "$FW_ASSET" -d .
          rm -f "$FW_ASSET"
          test -f sts2.xcframework/Info.plist
          test -f MoltenVK.xcframework/Info.plist
          echo "xcframeworks ready"

      - name: Verify PCK present
        run: |
          ls -lh sts2.pck
          python3 - <<'PY'
          import struct
          with open('sts2.pck', 'rb') as f:
              head = f.read(112)
          assert head[:4] == b'GDPC', 'sts2.pck 不是 Godot PCK: %r' % head[:4]
          file_base = struct.unpack_from('<Q', head, 24)[0]
          dir_off = struct.unpack_from('<Q', head, 32)[0]
          print('PCK ok: file_base=%d dir_off=%d' % (file_base, dir_off))
          PY

      - name: Build BfiPatch tool
        run: |
          dotnet build tools/BfiPatch/BfiPatch.csproj -c Release --nologo
          dotnet build tools/TypeFlags/TypeFlags.csproj -c Release --nologo

      - name: NativeAOT publish (ios-arm64)
        run: |
          dotnet publish sts2.csproj \
            -c Release \
            -r ios-arm64 \
            -p:GodotTargetPlatform=ios \
            -p:PublishAot=true \
            -p:StripSymbols=false \
            -p:TrimmerSingleWarn=false \
            -o "$PWD/out-ios-arm64"

      - name: Verify BeforeFieldInit reached the ILC input
        run: |
          # ILC compiles @(IntermediateAssembly) = obj/Release/ios-arm64/sts2.dll.
          # If the BfiPatch target patched only bin/, this assembly stays unpatched and the
          # AOT image crashes with KeyNotFoundException 'RELIC.ASTROLABE' at ModelDb.Init.
          OBJ_DLL=".godot/mono/temp/obj/Release/ios-arm64/sts2.dll"
          test -f "$OBJ_DLL" || { echo "::error::ILC input assembly not found at $OBJ_DLL"; exit 1; }
          dotnet tools/TypeFlags/bin/Release/net9.0/TypeFlags.dll "$OBJ_DLL" bfi_types.txt
          echo "--- for reference, the bin/ copy ---"
          dotnet tools/TypeFlags/bin/Release/net9.0/TypeFlags.dll \
            .godot/mono/temp/bin/Release/ios-arm64/sts2.dll bfi_types.txt

      - name: Verify AOT output
        run: |
          ls -la out-ios-arm64/sts2.dylib
          file out-ios-arm64/sts2.dylib
          lipo -info out-ios-arm64/sts2.dylib

      - name: Create xcframework
        run: |
          rm -rf sts2_aot.xcframework
          xcodebuild -create-xcframework \
            -library "$PWD/out-ios-arm64/sts2.dylib" \
            -output "$PWD/sts2_aot.xcframework"
          find sts2_aot.xcframework -maxdepth 3 | head -20

      - name: Link AOT framework into pbxproj
        run: python3 tools/patch_pbxproj.py sts2.xcodeproj/project.pbxproj

      - name: Archive (unsigned)
        run: |
          rm -rf build/sts2.xcarchive
          xcodebuild archive \
            -project sts2.xcodeproj \
            -scheme sts2 \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -archivePath "$PWD/build/sts2.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -quiet

      - name: Detach the fmod dylib from launch-time loading
        run: |
          set -euo pipefail
          APP="build/sts2.xcarchive/Products/Applications/sts2.app"
          cp "$APP/sts2" "$RUNNER_TEMP/sts2.orig"
          # A weak reference is not enough: the framework really is in Frameworks/,
          # so dyld loads it and runs its static constructors before godot.log opens.
          # Retargeting the path at a nonexistent name (still LC_LOAD_WEAK_DYLIB, same
          # ordinal slot) makes dyld skip the image entirely; Godot then dlopen()s the
          # real framework after logging is up.
          python3 tools/disable_dylib_path.py "$APP/sts2" "$APP/sts2.new" \
            fmod.ios.template_release \
            "@rpath/fmod-disabled.framework/fmod-disabled"
          mv "$APP/sts2.new" "$APP/sts2"
          chmod +x "$APP/sts2"
          cmp -s "$APP/sts2" "$RUNNER_TEMP/sts2.orig" && \
            { echo "::error::executable unchanged - disable step did not run"; exit 1; }
          python3 tools/ordinal_dump.py "$APP/sts2" | sed -n '1,10p'
          echo "fmod no longer loaded by dyld; Godot will dlopen it at runtime"

      - name: Verify orientation and privacy keys survived packaging
        run: |
          set -euo pipefail
          APP="build/sts2.xcarchive/Products/Applications/sts2.app"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          d = plistlib.load(open(sys.argv[1], 'rb'))
          for key in ('UISupportedInterfaceOrientations', 'UISupportedInterfaceOrientations~ipad'):
              v = d.get(key) or []
              need = {'UIInterfaceOrientationLandscapeLeft', 'UIInterfaceOrientationLandscapeRight'}
              if not need.issubset(set(v)):
                  sys.exit('::error::%s = %r, expected both landscape directions' % (key, v))
              print('%s = %r' % (key, v))
          if 'NSCameraUsageDescription' in d or 'NSPhotoLibraryUsageDescription' in d:
              sys.exit('::error::empty camera/photo usage strings are still present')
          mic = d.get('NSMicrophoneUsageDescription')
          if not mic or not mic.strip():
              sys.exit('::error::NSMicrophoneUsageDescription must not be empty')
          print('NSMicrophoneUsageDescription = %r' % mic)
          PY

      - name: Weaken fmod flat-namespace binds in the archived framework
        run: |
          set -euo pipefail
          APP="build/sts2.xcarchive/Products/Applications/sts2.app"
          FMOD="$APP/Frameworks/fmod.ios.template_release.framework/fmod.ios.template_release"
          cp "$FMOD" "$RUNNER_TEMP/fmod.orig"
          # Godot opens the framework with RTLD_NOW, so dyld resolves every bind
          # eagerly. _load_all_fmod_plugins is defined nowhere, one miss kills the
          # whole dlopen and the GDExtension never registers (no BGM, most SFX
          # silent). N_WEAK_REF in the nlist does nothing here: dyld4 takes weak
          # semantics from the bind opcode flags, not from n_desc. So flip the
          # opcode immediate 0x40 -> 0x41 for all 30 flat-namespace binds.
          python3 tools/weaken_fmod_bind.py "$FMOD"
          python3 tools/weaken_fmod_bind.py --check "$FMOD"
          if cmp -s "$FMOD" "$RUNNER_TEMP/fmod.orig"; then
            echo "::error::fmod dylib unchanged - bind weakening did not run"
            exit 1
          fi
          echo "flat-namespace binds are weak imports; dlopen will succeed"

      - name: Stamp release_info.json into the app bundle
        run: |
          set -euo pipefail
          APP="build/sts2.xcarchive/Products/Applications/sts2.app"
          # ReleaseInfoManager looks for release_info.json next to the executable, which on iOS is
          # sts2.app/release_info.json. Without it ReleaseInfo stays null, ModManager warns
          # "Game doesn't have ReleaseInfo" and every mod is assumed compatible, and run metrics
          # record the build id as NON-RELEASE-VERSION. The version is the release tag minus the
          # -ios suffix; the tag is what the PCK was cut from.
          VERSION="${PCK_TAG%-ios}"
          DATE_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$APP/release_info.json" "$VERSION" "$DATE_UTC" "${{ github.sha }}" "${{ github.ref_name }}" <<'PY'
          import json, sys
          path, version, date, commit, branch = sys.argv[1:6]
          # main_assembly_hash is what AssemblyHasher would compute over sts2.dll. Under NativeAOT
          # the assembly has no on-disk Location, so the runtime reports 0; matching that keeps
          # Sentry's build hash comparison from flagging every crash as a mismatched build.
          info = {
              "commit": commit,
              "version": version,
              "date": date,
              "branch": branch,
              "main_assembly_hash": 0,
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(info, f, indent=2)
              f.write("\n")
          print("wrote", path, info)
          PY
          python3 - "$APP/release_info.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in ("commit", "version", "date", "branch", "main_assembly_hash"):
              assert key in d, "release_info.json is missing %s" % key
          assert d["version"], "release_info.json version is empty"
          print("release_info.json verified:", d["version"], d["commit"][:12])
          PY

      - name: Copy the baked content packs into the bundle
        run: |
          set -euo pipefail
          APP="build/sts2.xcarchive/Products/Applications/sts2.app"
          # The base game sts2.pck is a prebuilt release asset (~1.9 GB) that CI
          # reuses verbatim, so the ported character ships as its own pack beside
          # the executable. BakedContent.Mount() loads it before atlases and
          # localization, and its loc tables merge into the base ones.
          test -f res/Watcher.pck
          cp res/Watcher.pck "$APP/Watcher.pck"
          ls -lh "$APP/Watcher.pck"
          python3 - "$APP/Watcher.pck" <<'PY'
          import os, sys
          path = sys.argv[1]
          with open(path, 'rb') as f:
              head = f.read(4)
          assert head == b'GDPC', 'Watcher.pck is not a Godot PCK: %r' % head
          size = os.path.getsize(path)
          assert size > 1000000, 'Watcher.pck looks truncated: %d bytes' % size
          print('Watcher.pck ok: %d bytes' % size)
          PY
          # The Regent card-art rework is the same deal: a Harmony DLL upstream, so the
          # replacement portraits travel as their own pack and RegentCardArt.Mount()
          # loads it. Only textures and their .import remaps are inside; the upstream
          # pack's res://.godot caches are dropped at build time on purpose.
          test -f res/RegentArt.pck
          cp res/RegentArt.pck "$APP/RegentArt.pck"
          ls -lh "$APP/RegentArt.pck"
          python3 - "$APP/RegentArt.pck" <<'PY'
          import os, sys
          path = sys.argv[1]
          with open(path, 'rb') as f:
              head = f.read(4)
          assert head == b'GDPC', 'RegentArt.pck is not a Godot PCK: %r' % head
          size = os.path.getsize(path)
          assert size > 1000000, 'RegentArt.pck looks truncated: %d bytes' % size
          print('RegentArt.pck ok: %d bytes' % size)
          PY

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/sts2.xcarchive/Products/Applications/sts2.app build/Payload/
          cd build
          rm -f sts2-unsigned.ipa
          zip -qry sts2-unsigned.ipa Payload
          ls -lh sts2-unsigned.ipa
          unzip -l sts2-unsigned.ipa | head -20

      - name: Sanity check IPA
        run: |
          unzip -l build/sts2-unsigned.ipa | grep -E 'Payload/sts2.app/(sts2|sts2.pck|Watcher.pck|RegentArt.pck|release_info.json|Frameworks/)' || true
          test -f build/Payload/sts2.app/sts2
          test -f build/Payload/sts2.app/sts2.pck
          test -f build/Payload/sts2.app/Watcher.pck
          test -f build/Payload/sts2.app/RegentArt.pck
          test -f build/Payload/sts2.app/release_info.json
          du -sh build/Payload/sts2.app

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: sts2-unsigned-ipa
          path: build/sts2-unsigned.ipa
          retention-days: 14
          compression-level: 0

      # 直接把 IPA 挂到 Release：用户从 Release 页面点击就能下，不用等 artifact 回传。
      - name: Publish IPA to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${PCK_TAG}"
          IPA="build/sts2-unsigned.ipa"
          test -f "$IPA"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Slay the Spire 2 iOS ${GITHUB_SHA::7}" --notes "Automated build ${GITHUB_SHA}"
          gh release upload "$TAG" "$IPA" --clobber
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)\t\(.state)"'

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: sts2-dsym
          path: build/sts2.xcarchive/dSYMs/
          if-no-files-found: ignore
          retention-days: 7
